# fleet.yaml -- THE configuration for a Court-of-Rex fleet.
#
# CLIENT-AGNOSTIC BY DESIGN (Rex/Archy 2026-08-01): the strategic deliverable is the
# infrastructure-as-code, not this one fleet. Everything org/client-specific is an INPUT
# in the `org` block below -- provision.py reads it, nothing is hardcoded. The SAME code
# with a different `org` block stands up a client's fleet. Rebuild = one command.
#
# NO SECRETS -- names only. Secret values (bearer tokens, connector OAuth) live in the
# cloud environment / secret store, injected at deploy time, never in the repo.

schema_version: "0.1"

# ---- INPUTS: the only place a deployment is tied to an organisation ----
org:
  name: Datavation                      # display name of the org this fleet serves
  repo_owner: Datavation                # GitHub owner/org for the repo
  repo_name: datavation-fleet           # repo name
  # Connector *accounts* are chosen per seat below by connector id; the actual account
  # identity is bound at deploy time via OAuth in the cloud environment, not here.

fleet:
  repo:
    owner: "${org.repo_owner}"          # resolved from org inputs by provision.py
    name: "${org.repo_name}"
    visibility: private
    default_branch: main
    allow_unrestricted_branch_pushes: false   # control gate: routines push to claude/* only

  environment:
    name: fleet-default
    network_access: trusted
    custom_allowed_domains: []
    required_env_vars: []

  # Memory write-back reconcile (Archy ruling 2026-07-31), enforced in reconcile.py.
  memory_reconcile:
    enabled: true
    cadence: hourly
    merge_strategy: path-scoped-three-way

  # Wake model (Archy ruling 2026-08-01): EVENT-DRIVEN by default -- seats woken by
  # event / API / board reads, not all on polling schedules. "Always-on per seat" is a
  # future cost decision, parked, not needed to build.
  wake_model: event-driven

# Seats. Migrated as COPIES (parallel build -- OneDrive originals untouched). Each seat
# gets ONLY the connectors its job needs (least privilege), and a structural in-session
# write-boundary (defense-in-depth, generated into agents/<seat>/.claude/settings.json)
# on top of the reconcile allowlist.
seats:
  - name: cody
    role: builder
    source_seat: Cody
    model: claude-opus-4-8
    connectors: []                      # builder needs only the repo
    memory_owner: true
    triggers:
      - type: api                       # event-driven wake

  # Seat 2 -- document-touching comms seat; exercises the connector/least-privilege layer.
  - name: holly
    role: comms
    source_seat: Holly
    model: claude-sonnet-5
    memory_owner: true
    connectors:
      # Least privilege: comms needs a messaging channel and to READ fleet docs/board.
      # write_scope gates what provision will allow (sandbox|read|none during parallel
      # build; a live-write connector is a separate gated decision, never auto-granted).
      - id: telegram
        write_scope: sandbox            # message only its own test chat during build
      - id: notion
        write_scope: read               # read the Decision Board; no live write in build
    reports_to: marshall                # UAT-3: Holly hands Marshall a task via the repo bus
    triggers:
      - type: api                       # event-driven; woken to do comms work

  # Seat 3 -- Marshall (TP Group workflow); the counterpart Holly hands work to (UAT-3).
  - name: marshall
    role: coordinator
    source_seat: Marshall
    model: claude-opus-4-8
    memory_owner: true
    reviews_reports: true               # reads reports/ filed for it, produces the artefact
    connectors:
      - id: google-drive
        write_scope: read               # read TP Group data during the build
    triggers:
      - type: api
      - type: schedule                  # its own cycle to pick up handed-off work
        cron: "41 * * * *"
        enabled_by_default: false

  # Seat 4 -- Tessa, the independent QA gate. Verifies builds from a clean clone of main; never
  # fixes, never promotes. Read-only board access, NO write/messaging/money connector -- she files
  # a verdict and nothing goes outbound. Her independence maps onto the cloud clean-clone model.
  - name: tessa
    role: qa
    source_seat: Tessa
    model: claude-opus-4-8
    memory_owner: true
    connectors:
      - id: notion
        write_scope: read               # read the Decision Board (To = Tessa); no write
    triggers:
      - type: api                       # woken when a build is handed to it

  # Seat 5 -- Quinn, the CFO seat. Reads/analyses/drafts, NEVER moves money (permanent control
  # gate). Extract-first: consolidates from exported CSVs, so the build seat runs with NO
  # QuickBooks connector at all. Least privilege = notion(read) only. The live QuickBooks connect
  # and the live finance-data path are SEPARATE human-final gated decisions for the real Quinn
  # seat post-cutover (Archy ruling 2026-08-02) -- never a parallel-build seat. Money/send
  # connectors are refused by the forbidden-connector gate regardless.
  - name: quinn
    role: cfo
    source_seat: Quinn
    model: claude-opus-4-8
    memory_owner: true
    connectors:
      - id: notion
        write_scope: read               # read the Decision Board (To = Quinn); no write, no QB, no money
    triggers:
      - type: api                       # woken for a review / when handed a board item
      - type: schedule                  # period-triggered routines (weekly / month-end)
        cron: "23 7 * * 1"              # Mondays 07:23 -- weekly finance review
        enabled_by_default: false

# Utility routines (NOT seats): scheduled/ops routines a seat owns. Provisioned into the same
# console runbook with the SAME least-privilege rule as seats. cody-heartbeat is the UAT-2
# autonomous boot-proof: it runs bootcheck.py and commits a run-record -- so it needs NOTHING.
# Declaring connectors: [] here makes "zero connectors" a code fact (the runbook forces REMOVE
# ALL + a verify step), not something I have to remember to strip in the console by hand.
utility_routines:
  - name: cody-heartbeat
    owner_seat: cody
    purpose: autonomous PC-offline boot proof (runs bootcheck.py --trigger schedule)
    connectors: []                      # NONE -- least privilege; blast radius = zero
    triggers:
      - type: schedule
        cron: hourly
