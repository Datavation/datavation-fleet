# memory-reconcile -- the trusted hourly job that promotes each seat's OWN operational
# memory from its claude/* branch to main (path-scoped policy in lib/reconcile.py).
#
# WHY THIS IS A GITHUB ACTION AND NOT A SEAT ROUTINE (design note for Archy):
#   The control gate restricts seat routines to pushing claude/* branches only
#   (allow_unrestricted_branch_pushes: false). But reconcile must land memory on MAIN.
#   A sandboxed seat therefore CANNOT be the reconcile actor. CI is the correct trusted
#   actor: it has contents:write, runs on a schedule, and is separate from the seats it
#   serves. This establishes exactly ONE main-writer (this workflow) distinct from every
#   claude/*-only seat -- a tightening of the governance story, not a loosening. Flagged
#   to Archy for ratification; the policy it enforces is already his ruling.
#
# It NEVER clobbers: three-way merge, refuses canon/cross-seat/identity/context, surfaces
# conflicts to reports/MEMORY-AUDIT-*.md and fails loud instead of silently overwriting.

name: memory-reconcile

on:
  schedule:
    - cron: "15 * * * *"      # hourly at :15 (GitHub cron can lag; the phone steps allow for it)
  workflow_dispatch: {}        # manual trigger -- used by the UAT-5 phone test to force a run

permissions:
  contents: write

concurrency:
  group: memory-reconcile      # never two reconciles racing on main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # full history so merge-base works
          # Condition (c) (Archy 2026-08-02): the push below uses this checkout's persisted
          # credential = the workflow's OWN ephemeral GITHUB_TOKEN (permissions: contents:write
          # above), NEVER any seat's PAT. No seat credential is referenced anywhere in this file.
          # Condition (b) -- branch protection enforcing "only this CI token writes main; every
          # seat/PAT is claude/*-only" -- is a repo-settings task, evidenced separately (queued).

      - name: Fetch all claude/* branches
        run: git fetch origin "+refs/heads/claude/*:refs/remotes/origin/claude/*"

      - name: Git identity (the reconcile actor)
        run: |
          git config user.name "fleet-memory-reconcile"
          git config user.email "reconcile@datavation.local"

      - name: Reconcile own operational memory to main
        id: reconcile
        continue-on-error: true   # findings must not abort the push of the clean merges
        run: python reconcile.py --all --apply

      - name: Commit any audit findings
        run: |
          if [ -n "$(git status --porcelain reports/)" ]; then
            git add reports/
            git commit -m "memory reconcile: audit findings ($(date -u +%Y-%m-%dT%H:%MZ))"
          fi

      - name: Push main
        run: git push origin main

      - name: Fail loud if reconcile surfaced refused paths or conflicts
        if: steps.reconcile.outcome == 'failure'
        run: |
          echo "::error::reconcile surfaced refused paths or conflicts -- see reports/MEMORY-AUDIT-*.md on main"
          exit 1
